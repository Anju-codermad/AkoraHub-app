workflows:
  android-release:
    name: AkoraHub - Build Android (APK + AAB)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
      groups:
        # Groupe de variables à créer dans Codemagic (dashboard →
        # Teams/App settings → Environment variables → nouveau groupe
        # nommé "akorahub_secrets"). Contient les mêmes valeurs que les
        # secrets GitHub actuels :
        #   SUPABASE_URL, SUPABASE_ANON_KEY
        #   GOOGLE_SERVICES_JSON_BASE64  (optionnel — Firebase push)
        #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD  (optionnel — signature release)
        #   MAPS_API_KEY  (optionnel — suivi de livraison Google Maps,
        #     lu directement par android/app/build.gradle via System.getenv)
        #   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  (optionnel — upload de
        #     l'APK sur Cloudflare R2 pour le lien de mise à jour stable,
        #     24/08). Les pages HTML publiques (docs/formation-access/) ne
        #     dépendent plus de ce pipeline du tout depuis le 25/08 : elles
        #     sont hébergées sur Cloudflare Pages, branché directement sur
        #     le dépôt GitHub, redéploiement automatique à chaque push.
        #   UPDATE_VERSION_WEBHOOK_SECRET  (optionnel — doit correspondre
        #     au secret configuré côté Supabase, Edge Function
        #     update-latest-version)
        #   FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT  (optionnel — même
        #     contenu JSON que le secret GitHub du même nom, rôle IAM
        #     "Firebase App Distribution Admin" sur le projet akorahub-7ee66)
        - akorahub_secrets
      vars:
        PACKAGE_NAME: "com.akora_fanadiovana.app"
        # ID de l'app Android côté Firebase (Firebase Console -> Paramètres
        # du projet -> Vos applications -> Android -> "ID de l'application").
        # Pas un secret — nécessaire ici en valeur statique (et non générée
        # en cours de build via $CM_ENV) car Codemagic valide/résout la
        # section `publishing` AVANT l'exécution des scripts, donc une
        # variable créée dynamiquement par un script n'y est pas visible
        # (erreur "FIREBASE_APP_ID ... is not accessible", constatée le
        # 05/08 lors du premier essai avec extraction dynamique).
        FIREBASE_APP_ID: "1:970298717063:android:56651a4ba48ae521e59922"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Créer env.json à partir des variables Codemagic
        script: |
          cat > env.json << EOF
          {
            "SUPABASE_URL": "$SUPABASE_URL",
            "SUPABASE_ANON_KEY": "$SUPABASE_ANON_KEY"
          }
          EOF

      - name: Reconstruire google-services.json (Firebase) si configuré
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json restauré."
          else
            echo "Pas de GOOGLE_SERVICES_JSON_BASE64 — notifications push désactivées sur ce build."
          fi

      - name: Reconstruire le keystore de production si configuré
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/akora_release.jks
            cat > android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=akora_release.jks
          EOF
            echo "Clé de production restaurée."
          else
            echo "Pas de clé de production — build signé avec la clé debug."
          fi

      - name: Récupérer les dépendances Flutter
        script: flutter pub get

      - name: Compiler l'APK (release, séparé par architecture)
        # --split-per-abi : un APK par architecture CPU au lieu d'un seul
        # fichier "universel" empilant les 4 — ~4x plus léger pour un
        # téléphone donné (utile pour l'installer directement en test ;
        # le Play Store, lui, utilise l'AAB ci-dessous qui optimise déjà
        # par appareil automatiquement).
        # --android-skip-build-dependency-validation (13/08) : le channel
        # "stable" (non figé à une version précise ci-dessus) exige
        # désormais Gradle >= 8.14.0, alors que
        # android/gradle/wrapper/gradle-wrapper.properties est sur 8.11.1
        # (compatible avec l'AGP 8.9.1 utilisé ici) — sans ce flag, le
        # build échoue avant même de compiler quoi que ce soit. Flag
        # suggéré directement par le message d'erreur Flutter.
        script: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Compiler l'App Bundle (release) — format Google Play
        script: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Uploader l'APK sur Cloudflare R2
        # Même migration que .github/workflows/build-apk.yml côté GitHub
        # Actions (24/08) : le plan gratuit Netlify a atteint sa limite de
        # bande passante (site entier suspendu) à force de redéployer
        # l'APK à chaque build + chaque téléchargement client. R2 n'a pas
        # de frais de bande passante sortante. Optionnel : ignoré si les
        # secrets ne sont pas configurés.
        script: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY non configurés — étape ignorée."
            exit 0
          fi
          command -v aws >/dev/null 2>&1 || pip3 install --user --quiet awscli
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          if aws s3 cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
              s3://akorahub-releases/akorahub-latest.apk \
              --endpoint-url https://ecfee9b5296944ea1de770687795776a.r2.cloudflarestorage.com; then
            echo "export R2_UPLOAD_OK=1" >> "$CM_ENV"
          else
            echo "Upload R2 échoué (non bloquant)."
          fi

      - name: Notifier Supabase de la nouvelle version disponible
        # Alimente `app_latest_version` pour que l'app propose une mise à
        # jour au démarrage — voir core/updates/update_checker.dart.
        # downloadUrl n'utilise le lien R2 que si l'upload ci-dessus a
        # réellement réussi, sinon repli sur les Releases GitHub (même
        # logique côté GitHub Actions ; migré de Netlify vers R2 le 24/08).
        script: |
          if [ -z "$UPDATE_VERSION_WEBHOOK_SECRET" ]; then
            echo "UPDATE_VERSION_WEBHOOK_SECRET non configuré — étape ignorée."
            exit 0
          fi
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          if [ "$R2_UPLOAD_OK" = "1" ]; then
            DOWNLOAD_URL="https://pub-70ec95969f72425aa8ccf641a3bba312.r2.dev/akorahub-latest.apk"
          else
            DOWNLOAD_URL="https://github.com/Anju-codermad/AkoraHub-app/releases"
          fi
          HTTP_STATUS=$(curl -s -o /tmp/notify_response.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/update-latest-version" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-webhook-secret: $UPDATE_VERSION_WEBHOOK_SECRET" \
            -d "{\"versionName\":\"$VERSION_NAME\",\"buildNumber\":$BUILD_NUMBER,\"downloadUrl\":\"$DOWNLOAD_URL\"}") || true
          echo "Code HTTP : $HTTP_STATUS"
          cat /tmp/notify_response.json 2>/dev/null || echo "(aucune réponse reçue)"
          exit 0

    artifacts:
      - build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/**/mapping.txt

    publishing:
      # Optionnel — ignoré par Codemagic si FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT
      # ou FIREBASE_APP_ID sont vides. Même compte de service et même
      # groupe de testeurs ("testeurs") que côté GitHub Actions.
      firebase:
        firebase_service_account: $FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_APP_ID
          groups:
            - testeurs
          # Sans ça, Codemagic publie par défaut l'AAB (présent lui aussi
          # dans `artifacts:` ci-dessus) plutôt que l'APK — or distribuer
          # un AAB via Firebase App Distribution exige que le projet
          # Firebase soit lié à un compte Google Play (erreur "This
          # project is not linked to a Google Play account", constatée le
          # 05/08 : on n'a pas encore ce compte). L'APK, lui, se distribue
          # sans cette condition.
          artifact_type: apk
      email:
        recipients:
          - akorafanadiovana@gmail.com
        notify:
          success: true
          failure: true
