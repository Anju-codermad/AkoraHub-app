<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Produit — AkoraHub</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --text: #1c2420;
    --text-muted: #59685f;
    --text-faint: #8a978f;
    --accent: #145f58;
    --accent-strong: #0a5142;
    --accent-soft: #e6f1ec;
    --border: #dfe6e0;
    --border-strong: #c5d0c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 480px; margin: 0 auto; padding: 1.6rem 1.1rem 3rem; }
  .brand {
    display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.2rem;
    font-weight: 700; color: var(--accent-strong); font-size: 1.05rem;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden; margin-bottom: 1.2rem;
  }
  .photo {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: var(--accent-soft);
    display: block;
  }
  .card-body { padding: 1.1rem 1.2rem 1.3rem; }
  .category {
    display: inline-block; font-size: 0.78rem; font-weight: 600; color: var(--accent-strong);
    background: var(--accent-soft); padding: 0.2rem 0.6rem; border-radius: 999px; margin-bottom: 0.6rem;
  }
  h1 { font-size: 1.3rem; margin: 0 0 0.4rem; letter-spacing: -0.01em; }
  .price { font-size: 1.15rem; font-weight: 700; color: var(--accent-strong); margin: 0 0 0.8rem; }
  .description { color: var(--text-muted); font-size: 0.92rem; margin: 0; }
  .actions { display: flex; flex-direction: column; gap: 0.7rem; }
  a.button {
    display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 0.98rem;
    padding: 0.85rem 1.1rem; border-radius: 8px;
  }
  a.button.primary { background: var(--accent); color: #fff; }
  a.button.ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
  .hint { color: var(--text-faint); font-size: 0.82rem; text-align: center; margin-top: 0.9rem; }
  .state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="page">
  <div class="brand">AkoraHub</div>
  <div id="content" class="state">Chargement du produit…</div>
</div>
<script>
  const SUPABASE_URL = "__SUPABASE_URL__";
  const SUPABASE_ANON_KEY = "__SUPABASE_ANON_KEY__";
  const APK_URL = "https://pub-70ec95969f72425aa8ccf641a3bba312.r2.dev/akorahub-latest.apk";

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const content = document.getElementById("content");

    if (!id || SUPABASE_URL.indexOf("__") === 0) {
      content.innerHTML = '<p>Lien produit invalide.</p>';
      return;
    }

    let product;
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/products?id=eq.${encodeURIComponent(id)}&select=name,description,image_url,price_detail,category,visibility`,
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
      );
      const rows = await res.json();
      product = rows && rows[0];
    } catch (e) {
      product = null;
    }

    if (!product || product.visibility === false) {
      content.className = "state";
      content.innerHTML = "<p>Ce produit n'est plus disponible.</p>";
      return;
    }

    const price = typeof product.price_detail === "number"
      ? product.price_detail.toLocaleString("fr-FR") + " Ar"
      : "";
    const photo = product.image_url
      ? `<img class="photo" src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}" />`
      : "";

    content.className = "";
    content.innerHTML = `
      <div class="card">
        ${photo}
        <div class="card-body">
          ${product.category ? `<span class="category">${escapeHtml(product.category)}</span>` : ""}
          <h1>${escapeHtml(product.name)}</h1>
          ${price ? `<p class="price">${price}</p>` : ""}
          ${product.description ? `<p class="description">${escapeHtml(product.description)}</p>` : ""}
        </div>
      </div>
      <div class="actions">
        <a class="button primary" href="akorahub://produit/${encodeURIComponent(id)}">Ouvrir dans l'app AkoraHub</a>
        <a class="button ghost" href="${APK_URL}">Télécharger AkoraHub</a>
      </div>
      <p class="hint">Si l'app n'est pas encore installée, télécharge-la puis crée ton compte pour commander.</p>
    `;
  }

  load();
</script>
</body>
</html>
