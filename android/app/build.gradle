plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Notifications push (Firebase). N'applique le plugin que si le fichier
// existe réellement (généré localement par le développeur ou injecté par
// le workflow CI depuis le secret GOOGLE_SERVICES_JSON_BASE64) — sinon
// TOUT le build échouerait avec "File google-services.json is missing".
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}

import java.util.Properties
import java.io.FileInputStream

// Config de signature release (voir android/key.properties, jamais commité —
// généré localement ou injecté par le workflow CI depuis les secrets
// GitHub : ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
// ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD). Si le fichier est absent
// (ex: un dev qui clone le repo sans la clé de prod), on retombe sur la
// signature debug pour que `flutter run` continue de fonctionner.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.akora_fanadiovana.app"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.akora_fanadiovana.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        minSdkVersion 23

        // Clé API Google Maps (suivi de livraison) — injectée depuis la
        // variable d'environnement MAPS_API_KEY au moment du build (secret
        // CI, même pattern que le keystore de production). Chaîne vide si
        // absente : le build réussit quand même, la carte affiche juste un
        // fond gris tant qu'une vraie clé n'est pas fournie (aucun crash).
        // ⚠️ `.put(...)` et non `manifestPlaceholders = [...]` : une
        // affectation directe remplace TOUTE la map et efface le
        // placeholder `applicationName` que le plugin Gradle de Flutter y
        // ajoute déjà de son côté (fait échouer le merge du manifest avec
        // "no value for <applicationName>").
        manifestPlaceholders.put("mapsApiKey", System.getenv("MAPS_API_KEY") ?: "")
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Vraie clé de production si key.properties est présent (build
            // Play Store / CI), sinon clé debug (build local sans la clé).
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

// Conformité Google Play "tailles de page mémoire 16 Ko" (21/10, mise à
// jour refusée par le Play Store sinon à partir du 1er nov. 2025) :
// `mobile_scanner` (scanner de produit) et `camera` (suivi photo) tirent
// chacun des bibliothèques natives Google (ML Kit barcode-scanning,
// CameraX) via leurs dépendances Android transitives, dans des versions
// trop anciennes pour être alignées sur 16 Ko (libbarhopper_v3.so,
// libimage_processing_util_jni.so — confirmé en inspectant le .so réel du
// dernier build avec `readelf -lW`, align = 0x1000 au lieu de 0x4000).
// On force ici les versions corrigées plutôt que d'attendre une mise à
// jour majeure de ces plugins Flutter (qui risquerait de casser leur API
// Dart) : aucun changement de code, seulement les bibliothèques natives
// réellement embarquées dans l'APK/AAB.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'androidx.camera') {
            details.useVersion '1.4.2'
        }
        if (details.requested.group == 'com.google.mlkit' &&
                details.requested.name == 'barcode-scanning') {
            details.useVersion '17.3.0'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'
}
