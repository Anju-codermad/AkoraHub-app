  screen_protector: ^1.4.2 # FLAG_SECURE (Android) sur les écrans de contenu Formation payant — bloque capture/enregistrement d'écran, voir PROJECT_CONTEXT.md (02/08)
  package_info_plus: ^8.1.2 # Vérification de mise à jour in-app — 04/08

