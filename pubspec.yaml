  pdf: ^3.11.3
  printing: ^5.14.2
  image_picker: ^1.0.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  http: ^1.2.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.1.0 # Aperçu des sons de notification dans les paramètres
  camera: ^0.10.5+5
  permission_handler: ^11.1.0
  geolocator: ^13.0.1
  intl_phone_field: ^3.2.0
  geocoding: ^3.0.0
