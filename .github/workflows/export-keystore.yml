name: Export keystore (sauvegarde ponctuelle)

# Déclenchement MANUEL uniquement (bouton "Run workflow" dans l'onglet
# Actions) — jamais automatique. Sert une seule fois à récupérer une
# copie de sauvegarde de la clé de signature Android de production, qui
# n'existe autrement QUE comme secret GitHub (write-only, impossible à
# relire une fois enregistré). À supprimer juste après usage : laisser ce
# workflow en place serait une porte ouverte inutile pour quiconque a accès
# au dépôt.
on:
  workflow_dispatch: {}

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruire le fichier .jks et les informations associées
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p keystore_export
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore_export/akora_release.jks
          cat > keystore_export/INFOS_A_GARDER_EN_SECURITE.txt << EOF
          AkoraHub - Clé de signature Android de production
          ====================================================
          Fichier : akora_release.jks (dans ce même dossier)

          storePassword = ${ANDROID_KEYSTORE_PASSWORD}
          keyAlias      = ${ANDROID_KEY_ALIAS}
          keyPassword   = ${ANDROID_KEY_PASSWORD}

          ⚠️ À GARDER EN LIEU SÛR (ex. gestionnaire de mots de passe,
          dossier privé chiffré) puis SUPPRIMER ce téléchargement du
          Cloud/de l'ordinateur une fois copié en sécurité. Ne jamais
          partager ni publier ces informations : quiconque les obtient
          peut publier des mises à jour sur la fiche Play Store à ta
          place.
          EOF
      - name: Publier en téléchargement privé (48h seulement)
        uses: actions/upload-artifact@v4
        with:
          name: akora-keystore-backup
          path: keystore_export/
          retention-days: 2
