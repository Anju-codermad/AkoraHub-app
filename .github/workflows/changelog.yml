name: Update Changelog

# Se déclenche à chaque push sur main, SAUF si le commit vient déjà
# de ce workflow (évite une boucle infinie de commits automatiques).
on:
  push:
    branches: [ main ]

jobs:
  update-changelog:
    name: Append commit to CHANGELOG.md
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip changelog]')"
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ajouter l'entrée au changelog
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          AUTHOR="${{ github.event.head_commit.author.name }}"
          MESSAGE="${{ github.event.head_commit.message }}"
          SHA="${{ github.event.head_commit.id }}"
          SHORT_SHA=${SHA:0:7}

          # Prend uniquement la première ligne du message de commit
          FIRST_LINE=$(echo "$MESSAGE" | head -n 1)

          echo "" >> CHANGELOG.md
          echo "## $DATE — $AUTHOR" >> CHANGELOG.md
          echo "- $FIRST_LINE (\`$SHORT_SHA\`)" >> CHANGELOG.md

      - name: Committer et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip changelog] [skip ci]" || echo "Rien à committer"
          git push
