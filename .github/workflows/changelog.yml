name: Update Changelog

# Se déclenche à chaque push sur main, SAUF si le commit vient déjà
# de ce workflow (évite une boucle infinie de commits automatiques).
on:
  push:
    branches: [ main ]

jobs:
  update-changelog:
    name: Append commit to CHANGELOG.md
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip changelog]')"
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ajouter l'entrée au changelog
        # Le message/auteur/SHA du commit passent par `env:` plutôt que
        # d'être interpolés directement dans le script `run:` — sinon,
        # tout guillemet, backtick ou `$(...)` dans le message de commit
        # casse la syntaxe du script généré (voire pire, permettrait à
        # un message de commit malveillant d'exécuter du shell arbitraire
        # dans un job avec `contents: write` — anti-pattern connu des
        # GitHub Actions). Un message de commit contenant des guillemets
        # ("Mes réalisations"...) a fait planter cette étape le 04/08.
        env:
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.event.head_commit.id }}
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA=${COMMIT_SHA:0:7}

          # Prend uniquement la première ligne du message de commit
          FIRST_LINE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)

          {
            echo ""
            echo "## $DATE — $AUTHOR_NAME"
            echo "- $FIRST_LINE (\`$SHORT_SHA\`)"
          } >> CHANGELOG.md

      - name: Committer et pousser
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip changelog] [skip ci]" || echo "Rien à committer"
          git push
