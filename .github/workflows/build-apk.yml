name: Build Android APK

# Se déclenche automatiquement à chaque push sur main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Créer env.json à partir des secrets GitHub
        run: |
          cat > env.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Reconstruire google-services.json (Firebase) à partir du secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          else
            echo "Pas de secret GOOGLE_SERVICES_JSON_BASE64 configuré — les notifications push ne fonctionneront pas dans ce build."
          fi

      - name: Reconstruire le keystore de production à partir des secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/akora_release.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=akora_release.jks
          EOF
          else
            echo "Pas de clé de production configurée (secrets ANDROID_* absents) — build signé avec la clé debug."
          fi

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'App Bundle (release) — format exigé par Google Play
        run: flutter build appbundle --release

      - name: Compiler l'APK (release) — pour test/installation directe
        run: flutter build apk --release

      - name: Publier l'App Bundle comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: akora-fanadiovana-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: akora-fanadiovana-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
