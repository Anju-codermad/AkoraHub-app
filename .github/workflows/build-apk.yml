name: Build Android APK

# Se déclenche automatiquement à chaque push sur main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    # `secrets.*` n'est pas utilisable directement dans un `if:` d'étape
    # (erreur "Unrecognized named-value: 'secrets'", constatée le 04/08 —
    # a empêché le workflow entier de démarrer tant que ce n'était pas
    # corrigé) : on les fait transiter par `env:` au niveau du job, seul
    # contexte lisible depuis un `if:`.
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque sur le runner
        run: |
          echo "--- Espace disque avant nettoyage ---"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          echo "--- Espace disque après nettoyage ---"
          df -h /

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Créer env.json à partir des secrets GitHub
        run: |
          cat > env.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Reconstruire google-services.json (Firebase) à partir du secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          else
            echo "Pas de secret GOOGLE_SERVICES_JSON_BASE64 configuré — les notifications push ne fonctionneront pas dans ce build."
          fi

      - name: Extraire l'ID d'app Firebase (pour App Distribution)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' android/app/google-services.json)
          echo "FIREBASE_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Reconstruire le keystore de production à partir des secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/akora_release.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=akora_release.jks
          EOF
          else
            echo "Pas de clé de production configurée (secrets ANDROID_* absents) — build signé avec la clé debug."
          fi

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'App Bundle (release) — format exigé par Google Play
        # --android-skip-build-dependency-validation (13/08) : le channel
        # "stable" de Flutter (non figé à une version précise dans ce
        # workflow) est monté à une version qui exige Gradle >= 8.14.0,
        # alors que android/gradle/wrapper/gradle-wrapper.properties est
        # sur 8.11.1 (compatible avec l'AGP 8.9.1 utilisé ici) — sans ce
        # flag, chaque build échouait avant même de compiler quoi que ce
        # soit. Flag suggéré directement par le message d'erreur Flutter
        # lui-même ; évite de devoir faire monter Gradle ET l'AGP en
        # parallèle sans pouvoir tester la compatibilité localement.
        run: flutter build appbundle --release --android-skip-build-dependency-validation
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Compiler l'APK (release) — pour test/installation directe
        # --split-per-abi (11/08) : aligné sur Codemagic, qui produit
        # app-arm64-v8a-release.apk plutôt qu'un APK universel — sans ça,
        # le nom de fichier différait entre les deux pipelines et cassait
        # le lien stable /releases/latest/download/<nom> chaque fois que
        # ce workflow républiait "latest" avec un nom différent (constaté
        # 11/08 : lien Facebook cassé juste après un build réussi).
        # --android-skip-build-dependency-validation (13/08) : voir
        # commentaire sur l'étape App Bundle ci-dessus.
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Compiler la version web (admin) — même code que l'app mobile
        # 25/08, demande explicite : plutôt que de recoder l'admin en HTML/JS
        # séparément (doublon à maintenir), on compile directement l'app
        # Flutter existante pour le web — mêmes écrans produits/variantes/
        # commandes/formation, testés localement (build réussi sans erreur).
        # Certains écrans dépendant de plugins natifs (caméra, scanner
        # code-barre, carte de livraison, appels audio/vidéo) peuvent ne
        # pas fonctionner correctement sur navigateur — à vérifier au cas
        # par cas, non bloquant pour le reste de l'admin.
        run: flutter build web --release

      - name: Déployer l'admin web sur Cloudflare Pages
        # Optionnel — ignoré tant que CLOUDFLARE_API_TOKEN n'est pas
        # configuré (Account API Token, permission "Cloudflare Pages:Edit"
        # uniquement). Le projet "akorahub-admin" est créé automatiquement
        # par Wrangler au premier déploiement s'il n'existe pas déjà.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ecfee9b5296944ea1de770687795776a
        run: npx wrangler@latest pages deploy build/web --project-name=akorahub-admin --branch=main --commit-dirty=true

      - name: Publier sur Firebase App Distribution (testeurs bêta)
        # Optionnel — ne s'active que si le compte de service dédié est
        # configuré (secrets Dashboard GitHub -> Settings -> Secrets and
        # variables -> Actions -> FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT,
        # rôle IAM "Firebase App Distribution Admin" sur le projet Firebase
        # akorahub-7ee66). Canal de distribution gratuit pour élargir les
        # tests à de vrais testeurs (email + notification à chaque nouvelle
        # version) en attendant le budget Google Play — voir
        # PROJECT_CONTEXT.md, section Play Store.
        if: ${{ env.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          file: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}

      - name: Uploader l'APK sur Cloudflare R2
        # Remplace le dépôt de l'APK sur Netlify (24/08) — le plan gratuit
        # Netlify a une limite de bande passante mensuelle, et chaque
        # build + chaque téléchargement client consommaient ce quota au
        # même endroit que les pages publiques légères (docs/formation-access/),
        # ce qui a fini par tout suspendre (site entier mis en pause le
        # 24/08 : "reached its usage limits"). R2 (compatible S3) n'a
        # AUCUN frais de bande passante sortante — un fichier volumineux
        # téléchargé des milliers de fois n'y coûte jamais rien de plus
        # que le stockage (10 Go gratuits, l'APK en fait ~100-300 Mo).
        # Les pages HTML légères (docs/formation-access/) ne dépendent
        # plus de ce workflow du tout depuis le 25/08 : le site Akora
        # Fanadiovana est hébergé sur Cloudflare Pages, branché
        # directement sur ce dépôt GitHub, et se redéploie tout seul à
        # chaque push sur main (voir Cloudflare Dashboard -> Workers &
        # Pages -> akorahub). Netlify n'est plus utilisé du tout.
        #
        # Optionnel : ignoré tant que R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY
        # ne sont pas configurés côté secrets GitHub.
        if: ${{ env.R2_ACCESS_KEY_ID != '' && env.R2_SECRET_ACCESS_KEY != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          if aws s3 cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
              s3://akorahub-releases/akorahub-latest.apk \
              --endpoint-url https://ecfee9b5296944ea1de770687795776a.r2.cloudflarestorage.com; then
            echo "R2_UPLOAD_OK=1" >> "$GITHUB_ENV"
          else
            echo "Upload R2 échoué (non bloquant) — le lien de mise à jour restera sur GitHub Releases pour ce build."
          fi

      - name: Notifier Supabase de la nouvelle version disponible
        # Alimente `app_latest_version` (via l'Edge Function
        # update-latest-version) pour que l'app elle-même propose une
        # mise à jour au démarrage — voir core/updates/update_checker.dart.
        # Volontairement pas de `if:` sur un secret (voir plus haut) :
        # ne casse jamais le build (dernière ligne : exit 0 systématique).
        # Affiche le code HTTP + la réponse complète (au lieu d'avaler
        # l'erreur avec `curl -f`) — un premier essai avec ce comportement
        # masquait la vraie cause d'un échec persistant malgré un secret
        # correctement configuré des deux côtés (04-05/08).
        #
        # Vraie cause trouvée grâce au code HTTP/réponse ci-dessus (run
        # 301, 05/08) : 401 "UNAUTHORIZED_NO_AUTH_HEADER" — ce n'était
        # PAS le `x-webhook-secret` (jamais atteint), mais la
        # vérification JWT de la passerelle Supabase elle-même (activée
        # par défaut pour toute Edge Function déployée depuis le
        # Dashboard). D'où l'en-tête Authorization avec la clé anon
        # ci-dessous, en plus du secret applicatif.
        #
        # downloadUrl pointe vers le lien R2 stable UNIQUEMENT si l'upload
        # de l'étape précédente a réellement réussi (R2_UPLOAD_OK == 1) —
        # pas juste si les secrets sont configurés, pour ne jamais
        # construire un lien vers un fichier qui n'a pas été déposé (bug
        # repéré sur la tentative Supabase Storage précédente, corrigé le
        # 05/08 ; migré de Netlify vers R2 le 24/08, voir l'étape
        # "Uploader l'APK sur Cloudflare R2" ci-dessus). Repli sur
        # l'ancien lien GitHub (toujours inutilisable par un vrai client
        # tant que le dépôt est privé, mais au moins pas un lien mort).
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_VERSION_WEBHOOK_SECRET: ${{ secrets.UPDATE_VERSION_WEBHOOK_SECRET }}
        run: |
          VERSION_LINE=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          BUILD_NUMBER=$(echo "$VERSION_LINE" | cut -d'+' -f2)
          if [ "$R2_UPLOAD_OK" = "1" ]; then
            DOWNLOAD_URL="https://pub-70ec95969f72425aa8ccf641a3bba312.r2.dev/akorahub-latest.apk"
          else
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
          fi
          HTTP_STATUS=$(curl -s -o /tmp/notify_response.json -w "%{http_code}" \
            -X POST "$SUPABASE_URL/functions/v1/update-latest-version" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "x-webhook-secret: $UPDATE_VERSION_WEBHOOK_SECRET" \
            -d "{\"versionName\":\"$VERSION_NAME\",\"buildNumber\":$BUILD_NUMBER,\"downloadUrl\":\"$DOWNLOAD_URL\"}") || true
          echo "Code HTTP : $HTTP_STATUS"
          echo "Réponse :"
          cat /tmp/notify_response.json 2>/dev/null || echo "(aucune réponse reçue)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Notification de version échouée (non bloquant)."
          fi
          exit 0

      - name: Publier l'App Bundle et l'APK comme Release GitHub
        # Contourne totalement le quota de stockage Actions (500 Mo,
        # partagé entre tous les dépôts du compte) — les fichiers d'une
        # Release GitHub vivent dans un espace de stockage séparé et
        # beaucoup plus généreux (2 Go par fichier), et ne disparaissent
        # jamais après quelques jours contrairement aux artifacts.
        # Le tag est unique par build (numéro de run) pour ne jamais
        # entrer en conflit avec un build précédent.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
