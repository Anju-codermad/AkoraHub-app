name: Build Android APK

# Se déclenche automatiquement à chaque push sur main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Libérer de l'espace disque sur le runner
        run: |
          echo "--- Espace disque avant nettoyage ---"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -a -f || true
          echo "--- Espace disque après nettoyage ---"
          df -h /

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Créer env.json à partir des secrets GitHub
        run: |
          cat > env.json << EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Reconstruire google-services.json (Firebase) à partir du secret
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json
          else
            echo "Pas de secret GOOGLE_SERVICES_JSON_BASE64 configuré — les notifications push ne fonctionneront pas dans ce build."
          fi

      - name: Extraire l'ID d'app Firebase (pour App Distribution)
        if: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        run: |
          APP_ID=$(jq -r '.client[0].client_info.mobilesdk_app_id' android/app/google-services.json)
          echo "FIREBASE_APP_ID=$APP_ID" >> "$GITHUB_ENV"

      - name: Reconstruire le keystore de production à partir des secrets
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/akora_release.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=akora_release.jks
          EOF
          else
            echo "Pas de clé de production configurée (secrets ANDROID_* absents) — build signé avec la clé debug."
          fi

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Compiler l'App Bundle (release) — format exigé par Google Play
        run: flutter build appbundle --release
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Compiler l'APK (release) — pour test/installation directe
        run: flutter build apk --release
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Publier sur Firebase App Distribution (testeurs bêta)
        # Optionnel — ne s'active que si le compte de service dédié est
        # configuré (secrets Dashboard GitHub -> Settings -> Secrets and
        # variables -> Actions -> FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT,
        # rôle IAM "Firebase App Distribution Admin" sur le projet Firebase
        # akorahub-7ee66). Canal de distribution gratuit pour élargir les
        # tests à de vrais testeurs (email + notification à chaque nouvelle
        # version) en attendant le budget Google Play — voir
        # PROJECT_CONTEXT.md, section Play Store.
        if: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
          groups: ${{ secrets.FIREBASE_APP_DISTRIBUTION_GROUPS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}

      - name: Publier l'App Bundle et l'APK comme Release GitHub
        # Contourne totalement le quota de stockage Actions (500 Mo,
        # partagé entre tous les dépôts du compte) — les fichiers d'une
        # Release GitHub vivent dans un espace de stockage séparé et
        # beaucoup plus généreux (2 Go par fichier), et ne disparaissent
        # jamais après quelques jours contrairement aux artifacts.
        # Le tag est unique par build (numéro de run) pour ne jamais
        # entrer en conflit avec un build précédent.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
